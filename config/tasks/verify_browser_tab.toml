# 验证配置：浏览器 Page 模板（测试 Tab 创建）

name = "verify_browser_tab"
template = "browser_page"

[timeouts]
navigation_seconds = 10
operation_seconds = 10

[browser]
url = "https://example.com"
wait_for_login = false

# 不需要执行动作，直接提取字段
# actions 数组留空或不定义

[[fields]]
name = "title"
xpath = "//h1"
read = "text"
multiple = false
type = "string"
